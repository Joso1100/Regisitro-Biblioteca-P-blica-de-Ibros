<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="gemini190px.png">
<link rel="icon" type="image/png" sizes="512x512" href="gemini512px.png">
<link rel="apple-touch-icon" href="gemini512px.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#444444">
<title>Registro Biblioteca Pública de Ibros</title>

<style>
:root {
  --bg: #fff;
  --text: #222;
  --border: #ddd;
  --input-bg: #f5f5f5;
  --sidebar: #f0f0f0;
  --accent: #444; 
  --chat-ai-bg: #e1e1e1;
}
[data-theme="dark"] {
  --bg: #1a1a1a;
  --text: #eee;
  --border: #444;
  --input-bg: #2a2a2a;
  --sidebar: #2d2d2d;
  --chat-ai-bg: #3d3d3d;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  transition: background 0.3s, color 0.3s;
}

/* SIDEBAR */
.sidebar {
  width: 280px;
  height: 100vh;
  background: var(--sidebar);
  position: fixed;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  z-index: 100;
}

.sidebar-content {
  padding: 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

#menu-lateral {
  flex-grow: 1;
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.menu-link {
  display: block;
  padding: 8px 10px;
  color: var(--text);
  text-decoration: none;
  background: transparent;
  border: none;
  font-size: 15px;
  font-weight: bold;
  transition: opacity 0.2s;
}
.menu-link:hover {
  opacity: 0.6;
  text-decoration: underline;
}

/* CHAT */
#sidebar-chat {
  height: 70vh;
  min-height: 420px;
  display: flex;
  flex-direction: column;
  margin: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
}

.chat-header {
  background: var(--input-bg);
  padding: 12px;
  text-align: center;
  font-weight: bold;
  font-size: 15px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  margin: 0;
}

#chat-messages {
  flex-grow: 1;
  overflow-y: auto;
  padding: 10px;
  font-size: 13px;
}
.msg {
  padding: 8px;
  border-radius: 10px;
  margin-bottom: 6px;
  max-width: 85%;
  word-wrap: break-word;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.msg span.texto-msg {
  flex-grow: 1;
}
.user-msg {
  background: #555;
  color: white;
  margin-left: auto;
}
.ai-msg {
  background: var(--chat-ai-bg);
}

.altavoz {
  cursor: pointer;
  margin-left: 8px;
  font-size: 16px;
  opacity: 0.6;
  transition: 0.2s;
  user-select: none;
}
.altavoz:hover {
  opacity: 1;
  transform: scale(1.1);
}

/* CONTROLES DE CHAT */
.chat-controls {
  padding: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
}
#chat-input {
  flex-grow: 1;
  padding: 10px 15px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
  box-sizing: border-box;
  outline: none;
}

#mic-btn {
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--input-bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  transition: 0.3s;
}
#mic-btn.escuchando {
  background-color: #ff4d4d;
  color: white;
  border-color: #ff4d4d;
  animation: pulso 1.5s infinite;
}

@keyframes pulso {
  0% { transform: scale(0.95); }
  50% { transform: scale(1.05); }
  100% { transform: scale(0.95); }
}

/* MAIN CONTENT AREA */
.main {
  margin-left: 280px; 
  padding: 20px;
  width: calc(100% - 280px);
  box-sizing: border-box;
  position: relative; 
}

.btn-oscuro {
  position: absolute;
  top: 20px;
  right: 20px;
  padding: 10px 15px;
  background: var(--input-bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: 0.3s;
  z-index: 1000;
}

.header-container {
  display: flex;
  align-items: center; 
  justify-content: center; 
  position: relative;
  min-height: 250px; 
  margin-top: 20px;
  padding: 0 40px; 
}

.header-container img {
  position: absolute;
  left: 60px; 
  height: 250px; 
  width: 250px; 
  object-fit: contain; 
}

h1 {
  text-align: center;
  margin: 0;
  color: var(--text);
}

.toolbar {
  display: flex;
  gap: 15px;
  justify-content: center;
  align-items: center;
  margin: 20px 20px 40px 20px;
}
#searchInput {
  padding: 12px 25px;
  width: 100%;
  max-width: 500px;
  border-radius: 50px;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 15px;
  outline: none;
}

#estanterias {
  padding: 12px 20px;
  border-radius: 50px;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
}

.table-responsive {
  width: 100%;
}

table {
  width: 95%;
  margin: auto;
  border-collapse: collapse;
  table-layout: fixed;
}
th {
  text-align: left;
  font-weight: bold;
  color: var(--text);
  border-bottom: 2px solid var(--border);
}
td, th {
  padding: 12px 15px;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

th:nth-child(1), td:nth-child(1) { width: 50%; } 
th:nth-child(2), td:nth-child(2) { width: 30%; } 
th:nth-child(3), td:nth-child(3) { width: 20%; } 

.ubicacion-tag {
  color: #666;
  font-size: 11px;
  font-weight: bold;
  display: block;
  margin-top: 3px;
}

@media (max-width: 768px) {
  body { flex-direction: column; }
  .main { margin-left: 0; width: 100%; padding: 10px; }
  .sidebar { position: fixed; bottom: 0; left: 0; width: 100%; height: auto; border-right: none; border-top: 1px solid var(--border); background: var(--bg); z-index: 1000; }
  .sidebar-content { display: none; }
  #sidebar-chat { height: 60px; min-height: unset; margin: 0; border-radius: 0; border: none; transition: height 0.3s ease; }
  #sidebar-chat:focus-within { height: 60vh; box-shadow: 0 -5px 20px rgba(0,0,0,0.2); }
  .chat-header { font-size: 13px; padding: 8px; text-align: left; }
  .header-container { flex-direction: column; padding: 0; min-height: unset; }
  .header-container img { position: static; width: 90px; height: 90px; margin-bottom: 10px; }
  h1 { font-size: 18px; }
  .btn-oscuro { top: 10px; right: 10px; padding: 6px 10px; font-size: 12px; }
  #sidebar-chat::before { content: "🤖 IA"; position: absolute; top: -40px; right: 15px; background: #444; color: white; padding: 8px 14px; border-radius: 20px; font-size: 12px; }
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="sidebar-content">
      <img src="escudo.png" style="width:90px; margin: 0 auto;" alt="Escudo Sidebar" onerror="this.style.display='none'">
      <nav id="menu-lateral">
          <a href="index.html" class="menu-link">Inicio</a>
          <a href="acerca de.html" class="menu-link">Acerca de</a>
          <a href="descargar app.html" class="menu-link">Descargar App</a>
      </nav>
  </div>

  <div id="sidebar-chat">
      <div class="chat-header">Bibliotecario Digital</div>
      <div id="chat-messages"></div>
      <div class="chat-controls">
          <input id="chat-input" placeholder="Escribe tu mensaje..." disabled>
          <button id="mic-btn" onclick="iniciarVoz()" title="Hablar por micrófono" disabled>🎙️</button>
      </div>
  </div>
</div>

<div class="main">
  <button id="btn-tema" class="btn-oscuro" onclick="toggleTema()">Modo Oscuro</button>
  
  <div class="header-container">
      <img src="640px-Escudo_de_Ibros_(Jaén).svg.png">
      <h1>Registro Biblioteca Pública de Ibros</h1>
  </div>

  <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Busca por nombre, autor o código...">
      <select id="estanterias"></select>
  </div>

  <div class="table-responsive">
      <table>
          <thead>
              <tr>
                  <th>Título</th>
                  <th>Autor</th>
                  <th>Código</th>
              </tr>
          </thead>
          <tbody id="cuerpoTabla"></tbody>
      </table>
  </div>
</div>

<script>
// --- LÓGICA TEMA ---
function toggleTema() {
    const html = document.documentElement;
    const btn = document.getElementById("btn-tema");
    if (html.getAttribute("data-theme") === "dark") {
        html.removeAttribute("data-theme");
        localStorage.setItem("tema", "light");
        btn.innerText = "Modo Oscuro";
    } else {
        html.setAttribute("data-theme", "dark");
        localStorage.setItem("tema", "dark");
        btn.innerText = "Modo Claro";
    }
}
if (localStorage.getItem("tema") === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
    document.getElementById("btn-tema").innerText = "Modo Claro";
}

// --- CONFIGURACIÓN ---
const API_URL = "https://script.google.com/macros/s/AKfycbyBLvG-_RfWct0oych5RoIeQAlK-LpC-Xprp9SM4auL2kwMj81vXLpfg7cEsPKDWaOK/exec";

const tabla = document.getElementById("cuerpoTabla");
const select = document.getElementById("estanterias");
const chatInput = document.getElementById("chat-input");
const micBtn = document.getElementById("mic-btn");
const searchInput = document.getElementById("searchInput");

let historialChat = [];
let librosCache = []; 
let fuePorVoz = false; 

async function init() {
  addMsg("ai-msg", "¡Hola! Soy tu asistente de la Biblioteca de Ibros. ¿Qué te apetece leer hoy?", true);
  try {
      const res = await fetch(`${API_URL}?action=getEstanterias`);
      const data = await res.json();
      select.innerHTML = "";
      data.forEach(e => {
          const opt = document.createElement("option");
          opt.value = e; 
          opt.textContent = e;
          select.appendChild(opt);
      });
      cargar(select.value);
      activarControlesChat();
      cargarCacheFondo(data);
  } catch(e) {
      console.error("Error inicializando:", e);
      activarControlesChat();
  }
}

async function cargar(est) {
  try {
      const res = await fetch(`${API_URL}?estanteria=${encodeURIComponent(est)}`);
      const libros = await res.json();
      tabla.innerHTML = libros
          .filter(l => l.titulo && !String(l.titulo).includes("Título"))
          .map(l => `<tr><td>${l.titulo}</td><td>${l.autor || "Anónimo"}</td><td>${l.id || "N/A"}</td></tr>`)
          .join("");
  } catch(e) {
      tabla.innerHTML = "<tr><td colspan='3'>Error cargando datos.</td></tr>";
  }
}

async function cargarCacheFondo(estanterias) {
  for (let est of estanterias) {
      try {
          const res = await fetch(`${API_URL}?estanteria=${encodeURIComponent(est)}`);
          const libros = await res.json();
          libros.forEach(l => {
              if(l.titulo && !String(l.titulo).includes("Título")) {
                  librosCache.push({
                      titulo: String(l.titulo),
                      autor: String(l.autor || "Anónimo"),
                      id: String(l.id || "N/A"),
                      estanteria: est 
                  });
              }
          });
      } catch(e) {}
  }
}

// --- LÓGICA CHAT VERCEL ---
async function handleSend() {
  const text = chatInput.value.trim();
  if(!text) return;
  
  addMsg("user-msg", text, false);
  chatInput.value = "";
  desactivarControlesChat();
  
  historialChat.push({ role: "user", parts: [{ text: text }] });

  const loadingId = "carga-" + Date.now();
  addMsg("ai-msg", "Pensando...", false, loadingId);

  try {
      // LLAMADA A TU NUEVA API EN VERCEL
      const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ historial: historialChat.slice(-10) })
      });

      const data = await res.json();
      if(document.getElementById(loadingId)) document.getElementById(loadingId).remove(); 

      if(data.candidates && data.candidates.length > 0) {
          const respuestaIA = data.candidates[0].content.parts[0].text;
          addMsg("ai-msg", respuestaIA, true); 
          historialChat.push({ role: "model", parts: [{ text: respuestaIA }] });
          if (fuePorVoz) { leerVozAlta(respuestaIA); fuePorVoz = false; }
      } else {
          addMsg("ai-msg", "No he podido responder ahora mismo.", true);
      }
  } catch(e) {
      if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
      addMsg("ai-msg", "Error de conexión con el servidor.", true);
  } finally { 
      activarControlesChat();
  }
}

// --- VOZ Y OTROS ---
function leerVozAlta(texto) {
  if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); 
      const voz = new SpeechSynthesisUtterance(texto);
      voz.lang = 'es-ES'; 
      window.speechSynthesis.speak(voz);
  }
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let reconocimientoVoz;
if (SpeechRecognition) {
  reconocimientoVoz = new SpeechRecognition();
  reconocimientoVoz.lang = 'es-ES';
  reconocimientoVoz.onstart = () => { micBtn.classList.add("escuchando"); desactivarControlesChat(); };
  reconocimientoVoz.onresult = (e) => { chatInput.value = e.results[0][0].transcript; fuePorVoz = true; handleSend(); };
  reconocimientoVoz.onend = () => restaurarInterfazVoz();
}

function iniciarVoz() { if (reconocimientoVoz) reconocimientoVoz.start(); }
function restaurarInterfazVoz() { micBtn.classList.remove("escuchando"); chatInput.disabled = false; micBtn.disabled = false; chatInput.focus(); }
function activarControlesChat() { chatInput.disabled = false; micBtn.disabled = false; }
function desactivarControlesChat() { chatInput.disabled = true; micBtn.disabled = true; }

function addMsg(tipo, texto, altavoz = false, id = null) {
  const d = document.createElement("div");
  d.className = "msg " + tipo; 
  if (id) d.id = id;
  const s = document.createElement("span"); 
  s.className = "texto-msg"; s.innerText = texto; d.appendChild(s);
  if (altavoz && tipo === "ai-msg") {
      const a = document.createElement("span"); a.className = "altavoz"; a.innerHTML = "🔊"; a.onclick = () => leerVozAlta(texto); d.appendChild(a);
  }
  const container = document.getElementById("chat-messages");
  container.appendChild(d);
  container.scrollTop = container.scrollHeight; 
  return d;
}

chatInput.onkeypress = (e) => { if (e.key === "Enter") { fuePorVoz = false; handleSend(); } };
select.onchange = () => { searchInput.value = ""; cargar(select.value); };
init();
</script>
</body>
</html>
