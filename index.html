<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="gemini190px.png">
<link rel="icon" type="image/png" sizes="512x512" href="gemini512px.png">
<link rel="apple-touch-icon" href="gemini512px.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#444444">
<title>Registro Biblioteca Pública de Ibros</title>

<style>
:root {
  --bg: #fff;
  --text: #222;
  --border: #ddd;
  --input-bg: #f5f5f5;
  --sidebar: #f0f0f0;
  --chat-ai-bg: #e1e1e1;
}
[data-theme="dark"] {
  --bg: #1a1a1a;
  --text: #eee;
  --border: #444;
  --input-bg: #2a2a2a;
  --sidebar: #2d2d2d;
  --chat-ai-bg: #3d3d3d;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column; /* Cambiado para que todo fluya hacia abajo */
  transition: background 0.3s, color 0.3s;
}

/* MENÚ SUPERIOR HORIZONTAL (Para todas las vistas) */
.nav-container {
  width: 100%;
  background: var(--sidebar);
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
  z-index: 1000;
  display: flex;
  justify-content: center;
}

#menu-lateral {
  display: flex;
  flex-direction: row; /* Siempre horizontal */
  gap: 20px;
}

.menu-link {
  padding: 8px 15px;
  color: var(--text);
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
}

/* ÁREA DE CONTENIDO PRINCIPAL */
.main {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

.btn-oscuro {
  align-self: flex-end;
  padding: 10px 15px;
  background: var(--input-bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
}

/* HEADER: ESCUDO PRIMERO, LUEGO TÍTULO */
.header-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin: 20px 0;
}

.header-container img {
  height: 180px;
  width: auto;
  margin-bottom: 15px; /* Separación con el título */
}

h1 { margin: 0; font-size: 26px; font-weight: 800; }

/* CHAT IA (Debajo del Título) */
#sidebar-chat {
  width: 100%;
  height: 400px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 15px;
  overflow: hidden;
  margin: 20px 0;
  display: flex;
  flex-direction: column;
}

.chat-header {
  background: var(--input-bg);
  padding: 12px;
  text-align: center;
  font-weight: bold;
}

#chat-messages { flex-grow: 1; overflow-y: auto; padding: 10px; font-size: 14px; }

.msg { padding: 10px; border-radius: 10px; margin-bottom: 8px; max-width: 80%; }
.user-msg { background: #555; color: white; align-self: flex-end; margin-left: auto; }
.ai-msg { background: var(--chat-ai-bg); }

.chat-controls {
  padding: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
}

#chat-input {
  flex-grow: 1;
  padding: 12px;
  border-radius: 25px;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
}

/* BUSCADOR Y TABLA (Debajo de la IA) */
.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

#searchInput, #estanterias {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  flex-grow: 1;
}

table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }

/* AJUSTES MÓVIL */
@media (max-width: 600px) {
  .header-container img { height: 120px; }
  h1 { font-size: 20px; }
  .toolbar { flex-direction: column; }
  #sidebar-chat { height: 350px; }
}
</style>
</head>

<body>

<!-- 1. MENU (Arriba de todo) -->
<header class="nav-container">
    <nav id="menu-lateral">
        <a href="index.html" class="menu-link">Inicio</a>
        <a href="acerca de.html" class="menu-link">Acerca de</a>
        <a href="descargar app.html" class="menu-link">App</a>
    </nav>
</header>

<main class="main">
    <button id="btn-tema" class="btn-oscuro" onclick="toggleTema()">Modo Oscuro</button>

    <!-- 2. ESCUDO Y TÍTULO (En ese orden) -->
    <div class="header-container">
        <img src="640px-Escudo_de_Ibros_(Jaén).svg.png" alt="Escudo de Ibros">
        <h1>Registro Biblioteca Pública de Ibros</h1>
    </div>

    <!-- 3. IA (Debajo del título) -->
    <div id="sidebar-chat">
        <div class="chat-header">Asistente Digital</div>
        <div id="chat-messages"></div>
        <div class="chat-controls">
            <input id="chat-input" placeholder="Escribe aquí..." disabled>
            <button id="mic-btn" onclick="iniciarVoz()" disabled>🎙️</button>
        </div>
    </div>

    <!-- 4. BUSCADOR Y TABLA -->
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Buscar libro...">
        <select id="estanterias"></select>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Código</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</main>

<script>
// Mantén aquí toda tu lógica de JavaScript (API_URL, init, handleSend, etc.)
// Asegúrate de que este bloque de script sea idéntico en todas tus páginas para que la IA funcione en todas.
</script>
</body>
</html>
